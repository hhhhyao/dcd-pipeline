name: nasa_stage3_md_to_openai
author: yao.lewei1@huawei.com
authors: [yao.lewei1@huawei.com, zhouyiren@huawei.com]
description: >-
  Convert NASA markdown text.lance to OpenAI-style messages with role-based
  content parts. Removes leading YAML front matter, drops non-local markdown
  images, and rewrites text.lance only.
operation: map
network: false
input_format: [md]
input_fields:
  text: [id, data, info, tags]
  image: [id, image_bytes, info, data, tags]
output_format: json
output_fields:
  text: [id, data, info, tags]
  image: [id, image_bytes, info, data, tags]
config:
  - name: message_role
    type: str
    default: user
    label: Role used for the single generated OpenAI message
tags: [nasa, markdown, openai, multimodal, lance]
